<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acknowledge weekly report</title>
<style>
  :root { --page:#E8F5FA; --dark:#11495F; --gold:#D4AF37; --text:#222; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--text);
         font-family: Arial, Helvetica, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background:#fff; border:2px solid var(--gold); border-radius:14px; padding:24px; }
  .bismillah { text-align:center; font-size:26px; color:var(--dark); margin:0; }
  h1 { text-align:center; color:var(--dark); font-size:22px; margin:8px 0 4px; }
  .sub { text-align:center; color:#555; margin:0 0 20px; }
  .box { background:var(--dark); color:#fff; border-radius:10px; padding:12px 16px; margin:12px 0; }
  .box small { opacity:.85; display:block; }
  .box strong { font-size:18px; }
  label { display:block; font-weight:bold; color:var(--dark); margin:18px 0 6px; }
  select, textarea { width:100%; font-size:16px; padding:10px; border:1px solid #9bb; border-radius:8px; font-family:inherit; }
  textarea { min-height:110px; resize:vertical; }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:normal; color:var(--text); margin-top:20px; }
  .check input { width:22px; height:22px; margin-top:1px; flex:none; }
  button { width:100%; margin-top:22px; background:var(--dark); color:#fff; font-size:17px; font-weight:bold;
           padding:14px; border-radius:10px; border:2px solid var(--gold); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { text-align:center; font-size:18px; color:var(--dark); padding:12px 0; }
  .err { color:#a40000; text-align:center; margin-top:12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <p class="bismillah" dir="rtl">بسم الله الرحمن الرحيم</p>
  <h1>SMILE Center Quran Academy</h1>
  <p class="sub">Acknowledge weekly report</p>

  <div id="loading" class="msg">Loading…</div>
  <div id="message" class="msg hidden"></div>

  <form id="form" class="hidden">
    <div class="box"><small>Family</small><strong id="family"></strong></div>
    <div class="box"><small>Children</small><strong id="children"></strong></div>
    <div class="box"><small>Week</small><strong id="week"></strong></div>

    <label class="check"><input type="checkbox" id="read">
      <span>I have read this week's report.</span></label>

    <div id="aboutRow">
      <label for="about">My comment is about</label>
      <select id="about"></select>
    </div>

    <label for="comment">Comment for the teachers (optional)</label>
    <textarea id="comment" maxlength="2000"></textarea>

    <button type="submit" id="send" disabled>Acknowledge report</button>
    <p id="error" class="err hidden"></p>
  </form>
</div></div>

<script>
  // The address of the "report-api" function in Supabase.
  const API = "https://pbbfaoisnonqnrjcuaek.supabase.co/functions/v1/report-api";
  const token = new URLSearchParams(location.search).get("t") || "";
  const $ = (id) => document.getElementById(id);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function shortDate(iso) {
    const [, m, d] = iso.split("-").map(Number);
    return months[m - 1] + " " + d;
  }

  function showMessage(text) {
    $("loading").classList.add("hidden");
    $("form").classList.add("hidden");
    $("message").textContent = text;
    $("message").classList.remove("hidden");
  }

  async function load() {
    if (!token) return showMessage("This link is not valid. Please use the button in your email.");
    try {
      const res = await fetch(API + "?t=" + encodeURIComponent(token));
      const info = await res.json();
      if (info.status === "invalid") return showMessage("This link is not valid. Please use the button in your email.");
      if (info.status === "expired") return showMessage("This link has expired. Please ask the teachers to send a new one.");
      if (info.status === "acknowledged") return showMessage("This report was already acknowledged. JazakAllahu khairan!");
      if (info.status !== "open") throw new Error("unexpected");

      $("family").textContent = info.family_name;
      $("children").textContent = info.children.map((c) => c.name).join(" & ");
      $("week").textContent = shortDate(info.week_start) + " - " + shortDate(info.week_end);

      const about = $("about");
      if (info.children.length > 1) {
        about.add(new Option(info.children.map((c) => c.name).join(" & "), ""));
        for (const c of info.children) about.add(new Option(c.name, c.id));
      } else {
        $("aboutRow").classList.add("hidden");
        if (info.children.length === 1) about.add(new Option(info.children[0].name, info.children[0].id));
      }
      $("loading").classList.add("hidden");
      $("form").classList.remove("hidden");
    } catch (e) {
      showMessage("Something went wrong. Please try again in a moment.");
    }
  }

  $("read").addEventListener("change", () => { $("send").disabled = !$("read").checked; });

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("send").disabled = true;
    $("error").classList.add("hidden");
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          t: token,
          comment: $("comment").value,
          about: $("about").value || null,
        }),
      });
      const result = await res.json();
      if (result.status === "ok") return showMessage("Thank you! Your acknowledgment was received. JazakAllahu khairan.");
      if (result.status === "already") return showMessage("This report was already acknowledged. JazakAllahu khairan!");
      if (result.status === "expired") return showMessage("This link has expired. Please ask the teachers to send a new one.");
      throw new Error("failed");
    } catch (e) {
      $("error").textContent = "That did not go through. Please try again.";
      $("error").classList.remove("hidden");
      $("send").disabled = !$("read").checked;
    }
  });

  load();
</script>
</body>
</html>
