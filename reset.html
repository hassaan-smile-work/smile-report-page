<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a new password</title>
<style>
  :root { --page:#E8F5FA; --dark:#11495F; --gold:#D4AF37; --text:#222; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--text);
         font-family: Arial, Helvetica, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background:#fff; border:2px solid var(--gold); border-radius:14px; padding:24px; }
  .bismillah { text-align:center; font-size:26px; color:var(--dark); margin:0; }
  h1 { text-align:center; color:var(--dark); font-size:22px; margin:8px 0 4px; }
  .sub { text-align:center; color:#555; margin:0 0 20px; }
  label { display:block; font-weight:bold; color:var(--dark); margin:18px 0 6px; }
  input { width:100%; font-size:16px; padding:10px; border:1px solid #9bb; border-radius:8px; font-family:inherit; }
  button { width:100%; margin-top:22px; background:var(--dark); color:#fff; font-size:17px; font-weight:bold;
           padding:14px; border-radius:10px; border:2px solid var(--gold); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { text-align:center; font-size:18px; color:var(--dark); padding:12px 0; }
  .err { color:#a40000; text-align:center; margin-top:12px; }
  .hint { color:#555; font-size:14px; margin:6px 0 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <p class="bismillah" dir="rtl">بسم الله الرحمن الرحيم</p>
  <h1>SMILE Center Quran Academy</h1>
  <p class="sub">Choose a new password</p>

  <div id="message" class="msg hidden"></div>

  <form id="form" class="hidden">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off">
    <p class="hint">At least 8 characters.</p>

    <label for="again">Type it again</label>
    <input id="again" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off">

    <button type="submit" id="save">Save new password</button>
    <p id="error" class="err hidden"></p>
  </form>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // The same two public values the app uses. The publishable key is safe to
  // show: the database's access rules are what protect the data.
  const SUPABASE_URL = "https://pbbfaoisnonqnrjcuaek.supabase.co";
  const SUPABASE_KEY = "sb_publishable_in20LnNFm1qHETg0jFc9FA_HLiV08qT";
  const MIN_LENGTH = 8; // keep the same as the app and Supabase's setting

  const params = new URLSearchParams(location.search);
  const tokenHash = params.get("token_hash") || "";
  const $ = (id) => document.getElementById(id);

  function showMessage(text) {
    $("form").classList.add("hidden");
    $("message").textContent = text;
    $("message").classList.remove("hidden");
  }

  function showError(text) {
    $("error").textContent = text;
    $("error").classList.remove("hidden");
  }

  if (!tokenHash || params.get("type") !== "recovery") {
    showMessage("This link is not valid. Please ask for a new one from the app.");
  } else {
    $("form").classList.remove("hidden");
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("error").classList.add("hidden");
    const password = $("password").value;
    if (password.length < MIN_LENGTH) return showError("Use at least " + MIN_LENGTH + " characters.");
    if (password !== $("again").value) return showError("The two passwords are not the same.");

    $("save").disabled = true;
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    });
    try {
      // The link's code is only used now, when the button is pressed.
      const verified = await sb.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
      if (verified.error) {
        showMessage("This link has expired or was already used. Please ask for a new one from the app.");
        return;
      }
      const updated = await sb.auth.updateUser({ password: password });
      if (updated.error) {
        showError(updated.error.message);
        $("save").disabled = false;
        return;
      }
      await sb.auth.signOut();
      showMessage("Your password was changed. Go back to the app and sign in with your new password. JazakAllahu khairan.");
    } catch (e) {
      showError("That did not go through. Please try again.");
      $("save").disabled = false;
    }
  });
</script>
</body>
</html>
